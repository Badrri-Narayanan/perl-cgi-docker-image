services:
  perl-cgi-app:
    build: .
    image: perl-cgi-app:local
    ports:
      - "8080:8080"
    # Bind-mount the scripts for development so edits show up without a rebuild.
    volumes:
      - ./sample_perl_cgi_programs:/var/www/html
    environment:
      - SAMPLE_ENV_VAR=it_can_be_anything
